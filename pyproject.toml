[project]
name = "mad-coder"
version = "0.1.0"
description = "Mad Coder: a dockable Houdini Python editor with Ruff linting"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["mad-coder/scripts/python", "scripts", "tests"]
extraPaths = ["mad-coder/scripts/python", "scripts"]

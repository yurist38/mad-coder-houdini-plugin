name: Release Version

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version component to increment
        required: true
        type: choice
        default: fix
        options:
          - fix
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: mad-coder-release
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release source
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q mad-coder/scripts/python scripts tests
          python -m unittest discover -s tests -v
          ruff check mad-coder/scripts/python scripts tests
          basedpyright
      - name: Calculate next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          tag="$(python scripts/next_version.py --release-type "${RELEASE_TYPE}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Next release: ${tag}"
      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Mad Coder ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

  release:
    needs: create-tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.create-tag.outputs.tag }}
    secrets: inherit

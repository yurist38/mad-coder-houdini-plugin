name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install checks
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q mad-coder/scripts/python scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Ruff
        run: ruff check mad-coder/scripts/python scripts tests
      - name: Run BasedPyright
        run: basedpyright
